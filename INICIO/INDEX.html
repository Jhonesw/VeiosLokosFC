<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clube FC - Oficial</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div id="logo"><img id="logo-img" src="./TRANSPARENTE/LOGO1.png" alt="Logo"></div>

            </div>
            <button class="btn-next" onclick="nextFull()">&#10095;</button>
        </section>

        <section class="carrossel-vitrine-container">
            <div class="vitrine-wrapper">
                <button class="btn-prev-vitrine" onclick="prevVitrine()">&#10094;</button>
                <div class="slider-vitrine" id="sliderVitrine">
            
                    <img src="./ELENCO/ERENINHA.png" class="card-vitrine">
                    <img src="./ELENCO/ROMARIO.png" class="card-vitrine">
                    <img src="./ELENCO/PINGUIM.png" class="card-vitrine">
                    <img src="./ELENCO/NANDO.png" class="card-vitrine">

                    <img src="./ELENCO/JHOJHO.png" class="card-vitrine">
                    <img src="./ELENCO/MOISES.png" class="card-vitrine">
                    <img src="./ELENCO/DANIEL.png" class="card-vitrine">
                    <img src="./ELENCO/DOUGLAS.png" class="card-vitrine">
                    <img src="./ELENCO/RENAN.png" class="card-vitrine">
                    <img src="./ELENCO/MOISES.png" class="card-vitrine">
                    <img src="./ELENCO/LUIZ FELIPE.png" class="card-vitrine">
                    <img src="./ELENCO/LUIZ PRETO.png" class="card-vitrine">
                    <img src="./ELENCO/CARLOS.png" class="card-vitrine">
                    <img src="./ELENCO/GORDINHO.png" class="card-vitrine">
                    <img src="./ELENCO/LIMA.png" class="card-vitrine">
                    <img src="./ELENCO/NANZINHO.png" class="card-vitrine">
                    <img src="./ELENCO/ROGERINHO.png" class="card-vitrine">
                    <img src="./ELENCO/ARCANJO.png" class="card-vitrine">
                    <img src="./ELENCO/MARCUS.png" class="card-vitrine">
                    <img src="./ELENCO/JHONYES.png" class="card-vitrine">
                    <img src="./ELENCO/GABRIEL.png" class="card-vitrine">
                    <img src="./ELENCO/VANDERLEY.png" class="card-vitrine">
                    <img src="./ELENCO/EDEVINHO.png" class="card-vitrine">
                    <img src="./ELENCO/GUIGUI.png" class="card-vitrine">
                    </div>
                <button class="btn-next-vitrine" onclick="nextVitrine()">&#10095;</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
