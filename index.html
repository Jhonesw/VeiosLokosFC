<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Amistoso: Veios Loko FC vs Equipe Din fc">
    <meta property="og:description" content="QUARTA, dia 08/07 as 20h30 Arena Santa Cruz. Não perca! e Ganhe uma camisa VeiosLokosFC jogando gratis no site">
    <meta property="og:image" content="https://veioslokos.com.br/IMAGEM1VEIOS.webp?v=1.1">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:url" content="https://veioslokos.com.br">
    <meta property="og:type" content="website">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veios Lokos FC</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: sans-serif;
        }

        .fullscreen-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }

        .fade-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* 'cover' faz a imagem preencher toda a tela, cortando o excesso se necessário */
            object-fit: cover; 
            object-position: center;
            opacity: 0;
            transition: opacity 2.5s ease-in-out;
        }

        .active { opacity: 1; }

        .ui-overlay {
            position: absolute;
            bottom: 50px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 30px;
            z-index: 10;
        }

        button {
            padding: 15px 40px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            border-radius: 50px;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        button:hover {
            background-color: white;
            color: #000;
            transform: scale(1.1);
        }

        @media (max-width: 768px) {
            button { padding: 12px 20px; font-size: 14px; }
        }
    </style>
</head>
<body>

    <div class="fullscreen-container">
        <img src="./IMAGEM4VEIOS.webp" id="img1" class="fade-img active" alt="Logo 1">
        <img src="./IMAGEM1VEIOS.webp" id="img2" class="fade-img" alt="Logo 2">
    </div>

    <div class="ui-overlay">
     <a href="./Esporte.html"><button onclick="console.log('Esporte')">ESPORTE</button></a>
      <a href="./Veterano.html">  <button onclick="console.log('Veterano')">VETERANO</button></a>
    </div>

    <script>
        let showFirst = true;
        const img1 = document.getElementById('img1');
        const img2 = document.getElementById('img2');

        function toggleImages() {
            if (showFirst) {
                img1.classList.remove('active');
                img2.classList.add('active');
            } else {
                img2.classList.remove('active');
                img1.classList.add('active');
            }
            showFirst = !showFirst;
        }

        setInterval(toggleImages, 2000);
    </script>
</body>
</html>
