<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FutBotão Pro | Vila Dalva 2026</title>
    <style>
        :root {
            --field-green: #2d5a27;
            --field-light: #356a2e;
            --gold: #f1c40f;
            --neon-blue: #00d4ff;
            --bg-dark: #0a0a0a;
        }

        * { 
            touch-action: none; 
            user-select: none; 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body {
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            height: 100vh;
            height: 100svh; 
            background-image: url('./CAMPOPRO.webp'); 
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed; 
            background-repeat: no-repeat;
            background-color: var(--bg-dark); 
            transition: background-image 0.5s ease-in-out;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            overflow: hidden; 
            color: white;
        }

        /* --- ESTILO DO PRELOADER --- */
        #preloader {
            position: fixed; 
            inset: 0; 
            background: #000; 
            z-index: 99999;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
        }

        .loader-circle {
            width: 70px; 
            height: 70px; 
            border: 6px solid #222; 
            border-top: 6px solid var(--gold);
            border-radius: 50%; 
            animation: spin 1s linear infinite; 
            margin-bottom: 20px;
        }

        #load-text { 
            font-weight: bold; 
            letter-spacing: 2px; 
            color: var(--gold); 
            font-size: 1.2rem; 
        }

        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }

        /* COMANDO PARA FORÇAR HORIZONTAL NO RESPONSIVO */
        @media screen and (orientation: portrait) {
            body {
                transform: rotate(90deg);
                transform-origin: center;
                width: 100vh;
                height: 100vw;
            }
            .screen, #game-popup, #preloader {
                width: 100vh;
                height: 100vw;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%) rotate(0deg);
            }
        }

        .screen {
            position: fixed; 
            inset: 0; 
            background: radial-gradient(circle at center, rgba(26,26,26,0.9) 0%, rgba(0,0,0,1) 100%);
            z-index: 3000; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            padding: 20px;
            overflow-y: auto;
        }

        #vs-screen {
            background: rgba(0,0,0,0.95);
            z-index: 4000;
        }

        .vs-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 50px;
            animation: fadeIn 0.5s ease-out;
        }

        .vs-team {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 250px;
        }

        .vs-team img {
            width: 180px;
            height: 180px;
            object-fit: contain;
            filter: drop-shadow(0 0 20px rgba(255,255,255,0.2));
        }

        .vs-team h2 {
            margin-top: 15px;
            font-size: 1.5rem;
            color: #fff;
            text-transform: uppercase;
            text-align: center;
        }

        .vs-divider {
            font-size: 5rem;
            font-weight: 900;
            color: var(--gold);
            font-style: italic;
            text-shadow: 0 0 30px var(--gold);
        }

        @keyframes fadeIn { 
            from { opacity: 0; transform: scale(0.9); } 
            to { opacity: 1; transform: scale(1); } 
        }

        /* SELEÇÃO RESPONSIVA */
        .team-grid {
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); 
            gap: 15px; 
            margin-top: 20px;
            width: 100%;
            max-width: 900px;
            padding: 10px;
        }

        .team-card {
            background: rgba(34, 34, 34, 0.6); 
            border: 2px solid #444; 
            padding: 10px; 
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            text-align: center; 
            border-radius: 12px;
            backdrop-filter: blur(5px);
        }

        .team-card:hover { 
            border-color: var(--gold); 
            transform: translateY(-5px); 
            box-shadow: 0 5px 15px rgba(241, 196, 15, 0.3); 
        }
        
        .team-card img { 
            width: 65px; 
            height: 50px; 
            object-fit: contain; 
            margin-bottom: 8px; 
            background: transparent; 
        }

        .team-card p { 
            font-size: 0.75rem; 
            font-weight: bold; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
        }

        .mode-btn {
            width: 260px; 
            padding: 18px; 
            margin: 12px; 
            background: transparent;
            border: 2px solid var(--gold); 
            color: var(--gold); 
            font-weight: 900;
            cursor: pointer; 
            border-radius: 50px; 
            font-size: 1rem; 
            text-transform: uppercase;
            transition: 0.3s;
        }

        .mode-btn:hover { 
            background: var(--gold); 
            color: #000; 
            box-shadow: 0 0 20px var(--gold); 
        }

        .mode-btn:disabled { 
            border-color: #555; 
            color: #555; 
            cursor: not-allowed; 
        }

        #game-wrapper { 
            display: none; 
            position: absolute;
            inset: 0;
            align-items: center; 
            justify-content: center;
            width: 100%; 
            height: 100%;
            z-index: 10; 
            overflow: hidden;
        }

        #game-scaler {
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            transform-origin: center center;
            transition: transform 0.1s ease-out;
        }

        #header-ui {
            width: 900px; 
            height: 70px; 
            background: rgba(0,0,0,0.85);
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            padding: 0 10px; 
            border-radius: 20px 20px 0 0; 
            border: 1px solid #333; 
            border-bottom: 2px solid var(--gold);
            backdrop-filter: blur(10px);
        }

        /* --- ESTILO DOS CARROSSEIS --- */
        .carousel-container {
            width: 110px; 
            height: 55px; 
            overflow: hidden; 
            border: 1px solid #444; 
            border-radius: 8px; 
            background: #000; 
            position: relative;
        }
        .carousel-track {
            display: flex; 
            width: 400%; 
            height: 100%; 
            transition: transform 0.5s ease-in-out;
        }
        .carousel-track img {
            width: 110px; 
            height: 55px; 
            object-fit: cover; 
            pointer-events: none;
            -webkit-user-drag: none;
        }

        .ui-team-box { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            font-size: 0.8rem; 
            letter-spacing: 1px; 
            width: 180px; 
        }

        #scoreboard { 
            font-size: 1.2rem; 
            color: var(--gold); 
            text-shadow: 0 0 10px rgba(241, 196, 15, 0.5); 
            font-weight: 900; 
            text-align: center; 
            min-width: 80px;
        }

        #match-timer { 
            background: #000; 
            padding: 2px 10px; 
            border-radius: 10px; 
            border: 1px solid #444; 
            font-family: monospace; 
            font-size: 1.1rem; 
        }

        #field {
            position: relative; 
            width: 900px; 
            height: 460px; 
            background-color: var(--field-green);
            background-image: 
                linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px),
                repeating-linear-gradient(90deg, var(--field-green) 0px, var(--field-green) 50px, var(--field-light) 50px, var(--field-light) 100px);
            border: 8px solid #eee; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        #field::after {
            content: ''; 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%);
            width: 120px; 
            height: 120px; 
            border: 3px solid rgba(255,255,255,0.5); 
            border-radius: 50%;
        }

        #field::before {
            content: ''; 
            position: absolute; 
            top: 0; 
            bottom: 0; 
            left: 50%; 
            width: 3px; 
            background: rgba(255,255,255,0.5);
        }

        .disc {
            position: absolute; 
            width: 56px; 
            height: 56px;
            border-radius: 50%; 
            background: #111; 
            border: 4px solid #fff;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4); 
            z-index: 10; 
            overflow: hidden;
            display: flex; 
            align-items: center; 
            justify-content: center;
            transition: border-color 0.3s, transform 0.1s;
        }

        .disc img {
            pointer-events: none;
            -webkit-user-drag: none;
        }

        .disc.active { 
            border-color: var(--gold); 
            transform: scale(1.1) translate(-50%, -50%); 
            box-shadow: 0 0 20px var(--gold); 
        }

        .ball {
            position: absolute; 
            width: 22px; 
            height: 22px; 
            background: #fff; 
            border-radius: 50%; 
            z-index: 5; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            background-image: radial-gradient(circle at 30% 30%, #fff, #ccc);
        }

        .goal-post { 
            position: absolute; 
            width: 50px; 
            height: 140px; 
            top: 50%; 
            transform: translateY(-50%); 
            border: 5px solid rgba(255,255,255,0.8); 
            z-index: 2; 
            background: rgba(255,255,255,0.1); 
        }

        .goal-l { left: -50px; border-right: none; }
        .goal-r { right: -50px; border-left: none; }

        #indicator { 
            position: absolute; 
            height: 6px; 
            background: linear-gradient(90deg, transparent, var(--gold)); 
            border-radius: 3px; 
            transform-origin: 0 50%; 
            display: none; 
            z-index: 100;
            filter: drop-shadow(0 0 5px var(--gold));
        }

        .goal-anim {
            position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
            font-size: 10rem; font-weight: 900; color: var(--gold); z-index: 5000;
            text-shadow: 0 0 50px #fff, 0 0 100px var(--gold); pointer-events: none;
            animation: megaGoal 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes megaGoal { 
            0% { transform: scale(0) rotate(-45deg); opacity: 0; } 
            30% { transform: scale(1.2) rotate(10deg); opacity: 1; }
            100% { transform: scale(1); opacity: 0; } 
        }

        #game-popup {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            z-index: 9999; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 30px;
        }

        #game-popup img { 
            width: 280px; 
            max-width: 80%; 
            border: 4px solid var(--gold); 
            border-radius: 20px; 
            margin-bottom: 20px; 
            box-shadow: 0 0 30px var(--gold); 
        }

        #game-popup h2 { font-size: 3rem; text-transform: uppercase; margin-bottom: 10px; font-weight: 900; }
        #game-popup p { font-size: 1.3rem; color: #fff; margin-bottom: 10px; max-width: 500px; }
        #lives-status { color: var(--gold); font-weight: bold; font-size: 1.5rem; margin-bottom: 25px; text-shadow: 0 0 10px var(--gold); }

        /* TABELA RESPONSIVA */
        table { 
            width: 100%; 
            max-width: 700px; 
            border-collapse: collapse; 
            margin-top: 20px; 
            background: rgba(0,0,0,0.7); 
            border-radius: 15px; 
            border: 1px solid #444; 
            overflow: hidden; 
        }

        th, td { padding: 12px; border-bottom: 1px solid #333; text-align: center; }
        th { color: var(--gold); text-transform: uppercase; font-size: 0.85rem; background: rgba(255,255,255,0.05); }

        /* MEDIA QUERIES PARA CELULAR */
        @media screen and (max-width: 600px) {
            .team-grid { grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; }
            .team-card img { width: 50px; height: 40px; }
            th, td { padding: 6px; font-size: 0.7rem; }
            .mode-btn { width: 220px; padding: 15px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

<div id="preloader">
    <div class="loader-circle"></div>
    <div id="load-text">CARREGANDO... 0%</div>
</div>

<div id="game-popup">
    <img src="./VEIOS/LOGO.webp" id="pop-img" draggable="false">
    <h2 id="pop-title">TITULO</h2>
    <p id="pop-msg">Mensagem descritiva aqui.</p>
    <div id="lives-status"></div>
    <button class="mode-btn" id="pop-btn" onclick="">BOTÃO</button>
</div>

<div id="vs-screen" class="screen" style="display:none;">
    <div class="vs-container">
        <div class="vs-team">
            <img id="vs-logo-h" src="" draggable="false">
            <h2 id="vs-name-h"></h2>
        </div>
        <div class="vs-divider">X</div>
        <div class="vs-team">
            <img id="vs-logo-a" src="" draggable="false">
            <h2 id="vs-name-a"></h2>
        </div>
    </div>
    <button class="mode-btn" onclick="confirmVs()" style="margin-top: 50px;">ENTRAR NO CAMPO</button>
</div>

<div id="main-menu" class="screen" style="display:none;"> 
    <h1 style="color:var(--gold); margin-bottom: -20px; letter-spacing: 3px; text-align: center;"> LIGA DALVA 2026</h1>
        
    <div class="team-grid" id="selection-grid"></div>
</div>

<div id="mode-selection" class="screen" style="display:none;">
    <h1 id="selected-team-title" style="color:var(--gold); margin-bottom: 10px;"></h1>
    <div style="display:flex; flex-direction: column; margin-top:20px;">
        <button class="mode-btn" onclick="setMode('FREE')">MANO A MANO</button>
        <button class="mode-btn" onclick="setMode('COPA')">COPA DALVA</button>
        <button class="mode-btn" id="btn-liga-mode"  onclick="setMode('LIGA')">LIGA DALVA 2026</button>
    </div>
</div>

<div id="tournament-screen" class="screen" style="display:none;">
    <h1 id="screen-title" style="color:var(--gold); margin-bottom: 20px;"></h1>
    <div id="bracket-or-table"></div>
    <button class="mode-btn" id="btn-next-match" onclick="prepareMatch()" style="margin-top: 30px;">Próxima Partida</button>
</div>

<div id="game-wrapper">
    <div id="game-scaler">
        <div id="header-ui">
            <div id="ui-home" class="ui-team-box"></div>
            
            <div class="carousel-container">
                <div class="carousel-track" id="track-l">
                    <img src="../prop1.webp" draggable="false">
                    <img src="../prop2.webp" draggable="false">
                    <img src="../prop3.webp" draggable="false">
                    <img src="../prop4.webp" draggable="false">
                </div>
            </div>

            <div style="display: flex; flex-direction: column; align-items: center;">
                <div id="scoreboard"><span id="score-val">0 - 0</span></div>
                <div id="match-timer">00:45</div>
            </div>

            <div class="carousel-container">
                <div class="carousel-track" id="track-r">
                    <img src="../prop2.webp" draggable="false">
                    <img src="../prop3.webp" draggable="false">
                    <img src="../prop4.webp" draggable="false">
                    <img src="../prop1.webp" draggable="false">
                </div>
            </div>

            <div id="ui-away" class="ui-team-box" style="justify-content: flex-end;"></div>
        </div>
        <div id="field">
            <div class="goal-post goal-l"></div>
            <div class="goal-post goal-r"></div>
            <div id="indicator"></div>
        </div>
    </div>
</div>

<script>
    const TEAM_BACKGROUNDS = {

        'CG': './CAMPO1.webp', 'PDP': './CAMPO1.webp', 'FLA': './CAMPO1.webp'

    const ALL_TEAMS = [

    /* LÓGICA DO CARROSSEL */
    let currentSlide = 0;
    function rotateCarousels() {
        currentSlide = (currentSlide + 1) % 4;
        const offset = currentSlide * 110;
        const tl = document.getElementById('track-l');
        const tr = document.getElementById('track-r');
        if(tl) tl.style.transform = `translateX(-${offset}px)`;
        if(tr) tr.style.transform = `translateX(-${offset}px)`;
    }
    setInterval(rotateCarousels, 3000);

    function ajustarTela() {
        const gs = document.getElementById('game-scaler');
        if (!gs) return;
        const sX = window.innerWidth / 940, sY = window.innerHeight / 560;
        const s = Math.min(sX, sY, 1);
        gs.style.transform = `scale(${s})`;
    }
    window.addEventListener('resize', ajustarTela);

    function preloadAllAssets() {
        const imgs = ['./VEIOS/LOGO.webp']; 
        ALL_TEAMS.forEach(t => { imgs.push(t.logo); t.players.forEach(p => imgs.push(p.i)); });
        let l = 0; const tot = imgs.length; const txt = document.getElementById('load-text');
        imgs.forEach(src => {
            const img = new Image(); img.src = src;
            img.onload = img.onerror = () => {
                l++; const p = Math.floor((l / tot) * 100);
                txt.innerText = `CARREGANDO ELENCOS... ${p}%`;
                if (l >= tot) { setTimeout(() => { document.getElementById('preloader').style.display = 'none'; document.getElementById('main-menu').style.display = 'flex'; initSelection(); }, 800); }
            };
        });
    }

    let playerTeam = null, gameMode = '', opponents = [], currentMatchIdx = 0;
    let objects = [], isMoving = false, turn = 1, selectedPlayer = null, dragStart = null;
    let leagueTable = [], scoreH = 0, scoreA = 0, timeLeft = 45, matchTimer = null, period = 1, ballStarter = 1;
    let physicsId = null, goalLocked = false, playerLives = 3, copaConcluida = false; 
    let ligaStartTime = null; // Variável para cronometrar a liga
    const field = document.getElementById('field');

    function initSelection() {
        const grid = document.getElementById('selection-grid');
        grid.innerHTML = "";
        ALL_TEAMS.forEach(team => {
            const card = document.createElement('div');
            card.className = 'team-card';
            card.innerHTML = `<img src="${team.logo}" draggable="false"><p>${team.name}</p>`;
            card.onclick = () => selectTeam(team);
            grid.appendChild(card);
        });
    }

    function selectTeam(team) {
        playerTeam = team; playerLives = 3; 
        if (TEAM_BACKGROUNDS[team.id]) document.body.style.backgroundImage = `url('${TEAM_BACKGROUNDS[team.id]}')`;
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('mode-selection').style.display = 'flex';
        document.getElementById('selected-team-title').innerText = team.name;
    }

    function setMode(mode) {
        if(mode === 'LIGA' && !copaConcluida) {
            showPopup("./VEIOS/LOGO.webp", "ACESSO BLOQUEADO!", "Vença a Final da Copa primeiro!", "VOLTAR", () => {
                document.getElementById('game-popup').style.display = 'none';
                document.getElementById('mode-selection').style.display = 'flex';
            });
            return;
        }
        gameMode = mode; document.getElementById('mode-selection').style.display = 'none';
        currentMatchIdx = 0; scoreH = 0; scoreA = 0; timeLeft = 45; period = 1; ballStarter = 1;
        
        if(mode === 'LIGA') {
            ligaStartTime = new Date(); // Inicia o tempo da liga
            opponents = ALL_TEAMS.filter(t => t.id !== playerTeam.id).sort(() => 0.5 - Math.random());
            leagueTable = ALL_TEAMS.map(t => ({ id: t.id, name: t.name, pts: 0, v: 0, e:0, d: 0, gp: 0 }));
            showTournament('LIGA DALVA 2026');
        } else if(mode === 'FREE') {
            const pool = ALL_TEAMS.filter(t => t.id !== playerTeam.id);
            opponents = [pool[Math.floor(Math.random()*pool.length)]];
            prepareMatch();
        } else if(mode === 'COPA') {
            opponents = ALL_TEAMS.filter(t => t.id !== playerTeam.id).sort(() => 0.5 - Math.random()).slice(0,3);
            showTournament('COPA VILA DALVA');
        }
    }

    function prepareMatch() {
        document.getElementById('tournament-screen').style.display = 'none';
        document.getElementById('vs-screen').style.display = 'flex';
        const enemy = opponents[currentMatchIdx];
        document.getElementById('vs-logo-h').src = playerTeam.logo;
        document.getElementById('vs-name-h').innerText = playerTeam.name;
        document.getElementById('vs-logo-a').src = enemy.logo;
        document.getElementById('vs-name-a').innerText = enemy.name;
    }

    function confirmVs() {
        if (gameMode === 'LIGA') { window.open("https://mirodobutanta.com", "_blank"); }
        document.getElementById('vs-screen').style.display = 'none';
        document.getElementById('game-wrapper').style.display = 'flex';
        ajustarTela(); initMatch();
    }

    function showTournament(title) {
        document.getElementById('tournament-screen').style.display = 'flex';
        document.getElementById('screen-title').innerText = title;
        const container = document.getElementById('bracket-or-table');
        container.innerHTML = "";
        if(gameMode === 'LIGA') {
            let html = `<table><tr><th>POS</th><th style="text-align:left">TIME</th><th>PTS</th><th>V</th><th>E</th><th>D</th><th>GP</th></tr>`;
            leagueTable.sort((a,b) => b.pts - a.pts || b.v - a.v || b.gp - a.gp).forEach((t, i) => {
                html += `<tr style="${t.id === playerTeam.id ? 'color:var(--gold); background:rgba(255,255,255,0.1)' : ''}">
                    <td>${i+1}</td><td style="text-align:left">${t.name}</td><td><b>${t.pts}</b></td><td>${t.v}</td><td>${t.e}</td><td>${t.d}</td><td>${t.gp}</td>
                </tr>`;
            });
            container.innerHTML = html + `</table>`;
        } else {
            const fase = currentMatchIdx === 0 ? "QUARTAS" : (currentMatchIdx === 1 ? "SEMIFINAL" : "FINAL");
            container.innerHTML = `<div style="text-align:center;"><p style="color:var(--gold)">${fase}</p><h2>${playerTeam.name} VS ${opponents[currentMatchIdx].name}</h2></div>`;
        }
    }

    function startClock() {
        if(matchTimer) clearInterval(matchTimer);
        matchTimer = setInterval(() => {
            if(!isMoving) {
                timeLeft--;
                if(timeLeft <= 0) {
                    if(period === 1) {
                        period = 2; timeLeft = 45; ballStarter = (ballStarter === 1 ? 2 : 1);
                        showPopup("./VEIOS/LOGO.webp", "INTERVALO!", "Times trocando de lado!", "CONTINUAR", () => {
                            document.getElementById('game-popup').style.display = 'none';
                            document.getElementById('game-wrapper').style.display = 'flex';
                            ajustarTela(); initMatch();
                        });
                    } else { finalizeMatch(); }
                }
                updateClockUI();
            }
        }, 1000);
    }

    function updateClockUI() {
        const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
        const s = (timeLeft % 60).toString().padStart(2, '0');
        document.getElementById('match-timer').innerText = `${m}:${s}`;
    }

    function initMatch() {
        if (physicsId) cancelAnimationFrame(physicsId);
        physicsId = null; const enemy = opponents[currentMatchIdx];
        document.getElementById('ui-home').innerHTML = `<img src="${playerTeam.logo}" width="22" draggable="false"> <span>${playerTeam.name}</span>`;
        document.getElementById('ui-away').innerHTML = `<span>${enemy.name}</span> <img src="${enemy.logo}" width="22" draggable="false">`;
        document.getElementById('score-val').innerText = `${scoreH} - ${scoreA}`;
        field.querySelectorAll('.disc, .ball').forEach(d => d.remove());
        objects = []; goalLocked = false;
        const w = 900, h = 460, isFlipped = (period === 2);
        const pX = isFlipped ? 0.85 : 0.15, eX = isFlipped ? 0.15 : 0.85, dir = isFlipped ? -1 : 1;
        [[pX, 0.5], [pX+dir*0.15, 0.3], [pX+dir*0.15, 0.7], [pX+dir*0.27, 0.4], [pX+dir*0.27, 0.6]].forEach((p, i) => {
            const d = playerTeam.players[i]; createObj(w*p[0], h*p[1], 1, d.i, playerTeam.logo, d.n, playerTeam.color, d.p);
        });
        [[eX, 0.5], [eX-dir*0.15, 0.3], [eX-dir*0.15, 0.7], [eX-dir*0.27, 0.4], [eX-dir*0.27, 0.6]].forEach((p, i) => {
            const d = enemy.players[i]; createObj(w*p[0], h*p[1], 2, d.i, enemy.logo, d.n, enemy.color, d.p);
        });
        createObj(w/2, h/2, 0); isMoving = false; turn = ballStarter;
        if(turn === 2) execIA();
        physics(); if(timeLeft === 45) startClock();
    }

    function createObj(x, y, team, img, logo, name, teamColor, power = null) {
        const div = document.createElement('div');
        div.className = team === 0 ? 'ball' : 'disc';
        if(team !== 0) {
            div.style.borderColor = teamColor;
            div.innerHTML = `<div style="width:100%; height:100%; position:relative; pointer-events:none;">
                <img src="${img}" style="width:100%; height:100%; object-fit:cover; border-radius:50%" draggable="false">
                <img src="${logo}" style="position:absolute; top:2px; right:2px; width:22px;" draggable="false">
                <div style="position:absolute; bottom:0; width:100%; background:rgba(0,0,0,0.7); font-size:7px; text-align:center;">${name}</div>
            </div>`;
        }
        field.appendChild(div);
        const radius = team === 0 ? 11 : 28;
        const mass = (power === 'block') ? 5 : (team === 0 ? 0.6 : 2.5);
        const obj = { el: div, x, y, vx: 0, vy: 0, radius, team, mass, power };
        objects.push(obj);
        if(team === 1) {
            div.onmousedown = div.ontouchstart = (e) => {
                if (isMoving || turn !== 1) return;
                selectedPlayer = obj; obj.el.classList.add('active');
                const ev = e.touches ? e.touches[0] : e;
                dragStart = { x: ev.clientX, y: ev.clientY };
                document.getElementById('indicator').style.display = 'block';
            };
        }
    }

    function physics() {
        let moving = false; const w = 900, h = 460;
        objects.forEach((a, i) => {
            a.x += a.vx; a.y += a.vy; a.vx *= 0.985; a.vy *= 0.985;
            if (a.y < a.radius) { a.y = a.radius; a.vy *= -0.6; }
            if (a.y > h - a.radius) { a.y = h - a.radius; a.vy *= -0.6; }
            if (a.x < a.radius) {
                if (a.team === 0 && a.y > h*0.34 && a.y < h*0.66 && !goalLocked) { return triggerGoal(period === 1 ? 2 : 1); }
                a.x = a.radius; a.vx *= -0.6;
            }
            if (a.x > w - a.radius) {
                if (a.team === 0 && a.y > h*0.34 && a.y < h*0.66 && !goalLocked) { return triggerGoal(period === 1 ? 1 : 2); }
                a.x = w - a.radius; a.vx *= -0.6;
            }
            for (let j = i + 1; j < objects.length; j++) {
                const b = objects[j], dx = b.x - a.x, dy = b.y - a.y, dist = Math.hypot(dx, dy);
                if (dist < a.radius + b.radius) {
                    const nx = dx/dist, ny = dy/dist, vn = (a.vx-b.vx)*nx + (a.vy-b.vy)*ny;
                    if (vn > 0) {
                        const bounce = (a.power === 'strength' || b.power === 'strength') ? 2.4 : 1.7;
                        const jf = -bounce * vn / (1/a.mass + 1/b.mass);
                        a.vx += (jf*nx)/a.mass; a.vy += (jf*ny)/a.mass;
                        b.vx -= (jf*nx)/b.mass; b.vy -= (jf*ny)/b.mass;
                    }
                }
            }
            if (Math.abs(a.vx) > 0.1 || Math.abs(a.vy) > 0.1) moving = true;
            a.el.style.left = `${a.x}px`; a.el.style.top = `${a.y}px`; a.el.style.transform = `translate(-50%, -50%)`;
        });
        if (isMoving && !moving) { isMoving = false; turn = (turn === 1 ? 2 : 1); if(turn === 2) execIA(); }
        physicsId = requestAnimationFrame(physics);
    }

    window.onmousemove = window.ontouchmove = (e) => {
        if (!selectedPlayer) return;
        const ev = e.touches ? e.touches[0] : e;
        const dx = dragStart.x - ev.clientX, dy = dragStart.y - ev.clientY;
        const dist = Math.min(Math.hypot(dx, dy), 160);
        const ind = document.getElementById('indicator');
        ind.style.left = selectedPlayer.x + 'px'; ind.style.top = selectedPlayer.y + 'px'; 
        ind.style.width = dist + 'px'; ind.style.transform = `rotate(${Math.atan2(dy, dx)}rad)`;
    };

    window.onmouseup = window.ontouchend = (e) => {
        if (!selectedPlayer) return;
        const ind = document.getElementById('indicator');
        if(ind.style.display === 'none') return;
        const ev = e.changedTouches ? e.changedTouches[0] : e;
        const ang = Math.atan2(dragStart.y - ev.clientY, dragStart.x - ev.clientX);
        const power = parseFloat(ind.style.width) * 0.11;
        selectedPlayer.vx = Math.cos(ang) * power; selectedPlayer.vy = Math.sin(ang) * power;
        selectedPlayer.el.classList.remove('active'); selectedPlayer = null; 
        ind.style.display = 'none'; isMoving = true;
    };

    function triggerGoal(teamWhoScored) {
        if (goalLocked) return; goalLocked = true; 
        if(teamWhoScored === 1) scoreH++; else scoreA++;
        document.getElementById('score-val').innerText = `${scoreH} - ${scoreA}`;
        ballStarter = (teamWhoScored === 1 ? 2 : 1); 
        const msg = document.createElement('div'); msg.className = 'goal-anim'; msg.innerText = 'GOOOOOL!';
        document.body.appendChild(msg);
        setTimeout(() => { msg.remove(); if(scoreH >= 3 || scoreA >= 3) { finalizeMatch(); } else { initMatch(); } }, 1500);
    }

    function finalizeMatch() { 
        clearInterval(matchTimer); 
        
        // Atualiza tabela da liga se for o modo liga
        if(gameMode === 'LIGA') {
            const playerEntry = leagueTable.find(t => t.id === playerTeam.id);
            const enemyEntry = leagueTable.find(t => t.id === opponents[currentMatchIdx].id);
            playerEntry.gp += scoreH; enemyEntry.gp += scoreA;
            if(scoreH > scoreA) { playerEntry.pts += 3; playerEntry.v++; enemyEntry.d++; }
            else if(scoreH < scoreA) { enemyEntry.pts += 3; enemyEntry.v++; playerEntry.d++; }
            else { playerEntry.pts += 1; enemyEntry.pts += 1; playerEntry.e++; enemyEntry.e++; }
        }
        
        handleWin(); 
    }

    function handleWin() {
        if(gameMode === 'FREE') { location.reload(); } 
        else if(gameMode === 'LIGA') {
            currentMatchIdx++;
            if(currentMatchIdx >= opponents.length) { 
                // LÓGICA DE CAMPEÃO DA LIGA DALVA 2026
                const agora = new Date();
                const diff = agora - ligaStartTime;
                const h = Math.floor(diff / 3600000).toString().padStart(2, '0');
                const m = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
                const s = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
                const ms = (diff % 1000).toString().padStart(3, '0');
                const tempoFormatado = `${h}:${m}:${s}:${ms}`;
                
                const dataDia = agora.toLocaleDateString('pt-BR');
                const dataHora = agora.toLocaleTimeString('pt-BR');
                
                // Código de validação
                const codigoRaw = tempoFormatado.replace(/:/g, '') + dataDia.replace(/\//g, '') + dataHora.replace(/:/g, '');
                
                const msgFinal = `VOCÊ É O CAMPEÃO DA LIGA DALVA 2026! Você concluiu em ${tempoFormatado}. \nHoje ${dataDia} às ${dataHora}. \nCÓDIGO: ${codigoRaw}`;
                const waLink = `https://api.whatsapp.com/send?phone=5511981772139&text=${encodeURIComponent(msgFinal)}`;

                showPopup("./VEIOS/LOGO.webp", "🏆 CAMPEÃO DA LIGA! 🏆", msgFinal, "ENVIAR RESULTADO", () => {
                    window.open(waLink, "_blank");
                    location.reload();
                });
            } 
            else { 
                scoreH = 0; scoreA = 0; timeLeft = 45; period = 1; ballStarter = 1; 
                document.getElementById('game-wrapper').style.display = 'none'; 
                showTournament('LIGA DALVA 2026'); 
            }
        } else {
            if(scoreH > scoreA) {
                currentMatchIdx++;
                if(currentMatchIdx >= opponents.length) { 
                    copaConcluida = true;
                    showPopup("./VEIOS/LOGO.webp", "🏆 CAMPEÃO! 🏆", "LIGA ELITE DESBLOQUEADA!", "INICIAR LIGA", () => { document.getElementById('game-popup').style.display = 'none'; setMode('LIGA'); });
                } else { scoreH = 0; scoreA = 0; timeLeft = 45; period = 1; ballStarter = 1; document.getElementById('game-wrapper').style.display = 'none'; showTournament('COPA VILA DALVA'); }
            } else { openDefeatPopup(); }
        }
    }

    function showPopup(img, title, msg, btnText, callback) {
        document.getElementById('game-wrapper').style.display = 'none';
        const pop = document.getElementById('game-popup');
        document.getElementById('pop-img').src = img;
        document.getElementById('pop-title').innerText = title;
        document.getElementById('pop-msg').innerText = msg;
        const btn = document.getElementById('pop-btn');
        btn.innerText = btnText; btn.onclick = callback; pop.style.display = 'flex';
    }

    function openDefeatPopup() {
        playerLives--;
        showPopup("./VEIOS/LOGO.webp", "ELIMINADO!", `Vidas: ${playerLives}`, playerLives > 0 ? "REVANCHE" : "MENU", () => {
            if(playerLives > 0) { window.open("https://mirodobutanta.com", "_blank"); document.getElementById('game-popup').style.display = 'none'; document.getElementById('game-wrapper').style.display = 'flex'; ajustarTela(); scoreH = 0; scoreA = 0; timeLeft = 45; period = 1; goalLocked = false; initMatch(); } else { location.reload(); }
        });
    }

    function execIA() {
        setTimeout(() => {
            if(isMoving || goalLocked || objects.length === 0) return;
            const ball = objects.find(o => o.team === 0);
            const myP = objects.filter(o => o.team === 2);
            const w = 900, h = 460;
            const shooter = myP.reduce((prev, curr) => Math.hypot(curr.x-ball.x, curr.y-ball.y) < Math.hypot(prev.x-ball.x, prev.y-ball.y) ? curr : prev);
            const targetX = (period === 1) ? 0 : w; const targetY = h / 2;
            const angleBallToGoal = Math.atan2(targetY - ball.y, targetX - ball.x);
            const impactX = ball.x - Math.cos(angleBallToGoal) * 25;
            const impactY = ball.y - Math.sin(angleBallToGoal) * 25;
            const attackAngle = Math.atan2(impactY - shooter.y, impactX - shooter.x);
            shooter.vx = Math.cos(attackAngle) * 13; shooter.vy = Math.sin(attackAngle) * 13; isMoving = true;
        }, 600);
    }
    window.onload = preloadAllAssets;
</script>
</body>
