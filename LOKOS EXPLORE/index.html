<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tile Match Pro - Evolution</title>
    <style>
        :root {
            --tile-w: min(12vw, 75px);
            --tile-h: min(16vw, 95px);
            --depth: 8px;
            --ui-bg: rgba(255, 255, 255, 0.15);
            --header-h: 140px;
            --footer-h: 140px; /* Aumentado para dar mais espaço */
            --accent: #f1c40f;
            --primary: #1e90ff;
            --bg-gradient: radial-gradient(circle, #2c3e50 0%, #000000 100%);
        }

        /* --- TELA DE CARREGAMENTO --- */
        #loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #1a1a1a;
            z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; text-align: center; font-family: 'Segoe UI', sans-serif;
        }

        .loader-bar { width: 250px; height: 8px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; margin-top: 20px; border: 1px solid rgba(255,255,255,0.2); }
        .loader-progress { width: 0%; height: 100%; background: linear-gradient(90deg, #1e90ff, #00d4ff); transition: width 0.3s; }

        /* --- ESTILO GERAL --- */
        body {
            margin: 0; padding: 0;
            display: flex; flex-direction: column;
            height: 100vh; width: 100vw;
            background: var(--bg-gradient);
            background-attachment: fixed;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; touch-action: none;
            color: white;
            box-sizing: border-box;
        }

        #main-game { display: none; flex-direction: column; height: 100%; width: 100%; position: relative; }

        /* --- HEADER & SLOTS --- */
        .header-ui {
            height: var(--header-h);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 8px; padding-top: 5px;
        }

        .progress-container {
            width: 80%; max-width: 400px; height: 6px;
            background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden;
        }
        #level-progress-bar {
            width: 0%; height: 100%; background: var(--primary);
            box-shadow: 0 0 10px var(--primary); transition: width 0.4s ease;
        }

        .stats {
            font-size: 1rem; font-weight: 800; letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(30,144,255,0.5);
            background: rgba(0,0,0,0.3); padding: 5px 15px; border-radius: 20px;
            display: flex; gap: 12px; align-items: center;
        }

        #timer-display {
            color: #ff4757; font-family: monospace; font-size: 1.2rem;
            min-width: 60px; text-align: center;
        }

        #combo-badge {
            background: #e74c3c; color: white; padding: 2px 8px; border-radius: 5px;
            font-size: 0.8rem; display: none; animation: popIn 0.3s;
        }

        .slot-bar {
            width: 95%; max-width: 500px; height: 70px;
            background: var(--ui-bg); border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px; backdrop-filter: blur(15px);
            display: flex; align-items: center; justify-content: center;
            gap: 6px; padding: 0 10px; box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        /* Overlay de Pausa */
        #pause-indicator {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 10px;
            z-index: 1000; display: none; pointer-events: none; border: 1px solid var(--primary);
        }

        /* --- TABULEIRO --- */
        #game-board {
            flex: 1; position: relative; width: 100%; perspective: 1000px;
        }

        #tile-container {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90%; height: 85%; max-width: 1000px; max-height: 700px;
        }

        /* --- TILES --- */
        .tile {
            position: absolute; width: var(--tile-w); height: var(--tile-h);
            background: linear-gradient(145deg, #ffffff, #e6e6e6);
            border-radius: 12px; cursor: pointer;
            box-shadow: 0 var(--depth) 0 #95a5a6, 0 15px 25px rgba(0,0,0,0.4);
            display: flex; justify-content: center; align-items: center;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1); user-select: none;
        }

        .tile:hover:not(.locked) { transform: scale(1.05) translateY(-5px); }
        .tile:active:not(.locked) { transform: scale(0.95); }
        .tile img { width: 75%; height: 75%; object-fit: contain; pointer-events: none; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2)); }
        
        .tile.locked { 
            filter: brightness(0.5) grayscale(0.8); box-shadow: 0 4px 0 #34495e; pointer-events: none;
        }

        .tile-in-slot {
            width: calc(var(--tile-w) * 0.75); height: calc(var(--tile-h) * 0.75);
            background: white; border-radius: 8px;
            display: flex; justify-content: center; align-items: center;
            animation: popIn 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .tile-in-slot img { width: 80% !important; height: 80% !important; }

        @keyframes popIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* --- FOOTER --- */
        .footer-ui {
            height: var(--footer-h);
            display: flex; justify-content: center; align-items: center; gap: 15px;
            background: linear-gradient(to top, rgba(0,0,0,0.6), transparent);
            /* Sobe os botões para longe da borda inferior */
            padding-bottom: 35px; 
            box-sizing: border-box;
        }

        .btn-container { position: relative; }
        .chance-count {
            position: absolute; top: -8px; right: -8px;
            background: #ff4757; color: white; border-radius: 50%;
            width: 20px; height: 20px; font-size: 11px; font-weight: bold;
            display: flex; justify-content: center; align-items: center;
            border: 2px solid #fff; z-index: 1010; box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .btn-action {
            width: 55px; height: 55px; background: white; border-radius: 50%; border: none;
            font-size: 24px; box-shadow: 0 5px 0 #bdc3c7, 0 10px 20px rgba(0,0,0,0.3); 
            cursor: pointer; display: flex; justify-content: center; align-items: center;
            transition: all 0.1s; text-decoration: none; color: inherit;
        }
        .btn-action:active { transform: translateY(4px); box-shadow: 0 2px 0 #bdc3c7; }

        /* --- MODAIS --- */
        .overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); z-index: 2000;
            justify-content: center; align-items: center; backdrop-filter: blur(10px);
        }
        .modal { 
            background: #fff; padding: 40px; border-radius: 30px; text-align: center; 
            width: 85%; max-width: 350px; color: #333;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .star-rating { font-size: 3rem; color: #eee; margin: 20px 0; }
        .star-rating .active { color: var(--accent); animation: starPop 0.5s ease-out backwards; }
        .btn-modal {
            width: 100%; padding: 18px; border: none; border-radius: 50px;
            font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: transform 0.2s;
        }
        .btn-next { background: #2ecc71; color: white; box-shadow: 0 6px 0 #27ae60; }
        .btn-retry { background: #1e90ff; color: white; box-shadow: 0 6px 0 #0984e3; }
        .confetti { position: absolute; width: 10px; height: 10px; z-index: 1500; pointer-events: none; border-radius: 2px; }

    </style>
</head>
<body>

    <div id="loading-screen">
        <div style="font-size:1.8rem; font-weight:900; letter-spacing:2px;">TILE EXPLORE PRO</div>
        <div class="loader-bar"><div id="progress" class="loader-progress"></div></div>
        <p style="margin-top:15px; opacity:0.6; font-size:0.9rem;">Organizando os polígonos...</p>
    </div>

    <div id="main-game">
        <audio id="snd-click" src="https://cdn.pixabay.com/audio/2022/03/15/audio_731478147d.mp3"></audio>
        <audio id="snd-match" src="https://cdn.pixabay.com/audio/2021/08/04/audio_062539665a.mp3"></audio>
        <audio id="snd-lose" src="https://cdn.pixabay.com/audio/2024/02/09/audio_d0bc84d8f5.mp3"></audio>
        <audio id="snd-win" src="https://cdn.pixabay.com/audio/2021/08/04/audio_bb333792b0.mp3"></audio>

        <div class="header-ui">
            <div class="progress-container">
                <div id="level-progress-bar"></div>
            </div>
            <div class="stats">
                <div id="timer-display">01:00</div>
                <div>NÍVEL <span id="lvl">1</span></div>
                <div>PTS: <span id="score">0</span></div>
                <div id="combo-badge">COMBO x1</div>
            </div>
            <div class="slot-bar" id="slot-bar"></div>
        </div>

        <div id="game-board">
            <div id="pause-indicator">⏸️ TEMPO PARADO</div>
            <div id="tile-container"></div>
        </div>

        <div class="footer-ui">
            <div class="btn-container">
                <span class="chance-count" id="undo-count">3</span>
                <button class="btn-action" id="btn-undo" onclick="openMiro(); handleUndo()">↩️</button>
            </div>
            <div class="btn-container">
                <span class="chance-count" id="hint-count">3</span>
                <button class="btn-action" id="btn-hint" onclick="openMiro(); handleHint()">🪄</button>
            </div>
            <div class="btn-container">
                <span class="chance-count" id="shuffle-count">3</span>
                <button class="btn-action" id="btn-shuffle" onclick="openMiro(); handleShuffle()">🔀</button>
            </div>
            <div class="btn-container">
                <span class="chance-count" id="pause-count">10</span>
                <button class="btn-action" id="btn-pause" onclick="handlePause()" title="Parar Tempo">⏸️</button>
            </div>
        </div>

        <div id="lose-overlay" class="overlay">
            <div class="modal">
                <h2 id="lose-title">😵 Esgotado!</h2>
                <p id="lose-msg">O suporte ficou cheio ou o tempo acabou!</p>
                <button class="btn-modal btn-retry" onclick="resetGameAfterLoss()">Recomeçar Jornada</button>
            </div>
        </div>

        <div id="win-overlay" class="overlay">
            <div class="modal">
                <h2>🏆 Brilhante!</h2>
                <div id="stars" class="star-rating"><span>★</span><span>★</span><span>★</span></div>
                <p style="font-size: 1.2rem; font-weight: bold; color: #7f8c8d;">+<span id="final-score">0</span> PONTOS</p>
                <button class="btn-modal btn-next" onclick="nextLevel()">Próximo Nível</button>
            </div>
        </div>
    </div>

    <script>
        function openMiro() { window.open('http://mirodobutanta.com', '_blank'); }

        let level = parseInt(localStorage.getItem('tileLevel')) || 1;
        let score = parseInt(localStorage.getItem('tileScore')) || 0;
        let activeTiles = [];
        let collected = [];
        let history = [];
        let chances = { undo: 3, hint: 3, shuffle: 3, pause: 10 };
        
        let timeLeft = 60;
        let timerInterval;
        let isPaused = false;
        let lastMatchTime = 0;
        let comboMultiplier = 1;
        let totalTriosInLevel = 0;
        let currentTriosFound = 0;

        const container = document.getElementById('tile-container');
        const slotBar = document.getElementById('slot-bar');
        const sounds = {
            click: document.getElementById('snd-click'),
            match: document.getElementById('snd-match'),
            lose: document.getElementById('snd-lose'),
            win: document.getElementById('snd-win')
        };

        function preLoadAssets() {
            let loaded = 0;
            const images = [`imagens/imgbk.webp`];
            for(let i=1; i<=30; i++) images.push(`imagens/img${i}.webp`);
            images.forEach(src => {
                const img = new Image();
                img.src = src;
                img.onload = () => {
                    loaded++;
                    document.getElementById('progress').style.width = (loaded/images.length)*100 + '%';
                    if(loaded === images.length) {
                        setTimeout(() => {
                            document.getElementById('loading-screen').style.display='none';
                            document.getElementById('main-game').style.display='flex';
                            initGame();
                        }, 1500);
                    }
                };
                img.onerror = img.onload;
            });
        }

        function startTimer() {
            if (isPaused) return;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    gameOver("⏰ Tempo Esgotado!");
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            document.getElementById('timer-display').innerText = 
                `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function handlePause() {
            if (chances.pause <= 0 || isPaused) return;
            chances.pause--;
            updateUIChances();
            isPaused = true;
            clearInterval(timerInterval);
            document.getElementById('pause-indicator').style.display = 'block';
            openMiro();
        }

        function resumeTimer() {
            if (isPaused) {
                isPaused = false;
                document.getElementById('pause-indicator').style.display = 'none';
                startTimer();
            }
        }

        function gameOver(msg) {
            playSound('lose');
            document.getElementById('lose-title').innerText = msg;
            document.getElementById('lose-overlay').style.display = 'flex';
        }

        function getShapePosition(index, total, shapeType) {
            const centerX = 45; const centerY = 40;
            const step = index / total;
            switch(shapeType) {
                case 'circle': return { x: centerX + 35 * Math.cos(2 * Math.PI * step), y: centerY + 35 * Math.sin(2 * Math.PI * step) };
                case 'heart': 
                    const t = step * 2 * Math.PI;
                    return { x: centerX + 2.5 * (16 * Math.sin(t)**3), y: centerY - 2.5 * (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) };
                case 'star': return { x: centerX + ((index % 2 === 0) ? 40 : 15) * Math.cos(step * 2 * Math.PI), y: centerY + ((index % 2 === 0) ? 40 : 15) * Math.sin(step * 2 * Math.PI) };
                case 'diamond':
                    const s = 40;
                    if(step < 0.25) return { x: centerX + (step*4)*s, y: centerY - (1-step*4)*s };
                    if(step < 0.50) return { x: centerX + (1-(step-0.25)*4)*s, y: centerY + ((step-0.25)*4)*s };
                    if(step < 0.75) return { x: centerX - ((step-0.5)*4)*s, y: centerY + (1-(step-0.5)*4)*s };
                    return { x: centerX - (1-(step-0.75)*4)*s, y: centerY - ((step-0.75)*4)*s };
                default: return { x: 5 + Math.random() * 80, y: 5 + Math.random() * 75 };
            }
        }

        function initGame() {
            container.innerHTML = ''; slotBar.innerHTML = '';
            activeTiles = []; collected = []; history = [];
            currentTriosFound = 0; comboMultiplier = 1; isPaused = false;
            document.getElementById('pause-indicator').style.display = 'none';
            
            if(level === 1) timeLeft = 60;
            else {
                let bonusThisLevel = 10 + (level - 2) * 5;
                timeLeft += bonusThisLevel;
            }

            updateTimerDisplay();
            startTimer();
            updateProgressBar();
            document.getElementById('combo-badge').style.display = 'none';
            document.getElementById('lvl').innerText = level;
            document.getElementById('score').innerText = score;
            document.querySelectorAll('.overlay').forEach(o => o.style.display = 'none');
            updateUIChances();

            let numTrios = Math.min(3 + Math.floor(level / 1.5), 18);
            totalTriosInLevel = numTrios;
            let totalTiles = numTrios * 3;
            const shapes = ['circle', 'star', 'heart', 'diamond', 'random'];
            const currentShape = shapes[level % shapes.length];
            let pool = [];
            for(let i=1; i<=30; i++) pool.push(`imagens/img${i}.webp`);
            pool.sort(() => Math.random() - 0.5);
            let levelImgs = pool.slice(0, numTrios);
            let deck = [];
            levelImgs.forEach(img => deck.push(img, img, img));
            deck.sort(() => Math.random() - 0.5);

            for(let i=0; i<totalTiles; i++) {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.innerHTML = `<img src="${deck[i]}">`;
                tile.dataset.src = deck[i];
                tile.style.zIndex = Math.floor(i / (totalTiles/5));
                const pos = getShapePosition(i, totalTiles, currentShape);
                tile.style.left = pos.x + '%'; tile.style.top = pos.y + '%';
                tile.onclick = () => selectTile(tile);
                container.appendChild(tile);
                activeTiles.push(tile);
            }
            updateLocks();
        }

        function updateLocks() {
            activeTiles.forEach(t => t.classList.remove('locked'));
            activeTiles.forEach(t1 => {
                const r1 = t1.getBoundingClientRect();
                const z1 = parseInt(t1.style.zIndex);
                activeTiles.forEach(t2 => {
                    const r2 = t2.getBoundingClientRect();
                    const z2 = parseInt(t2.style.zIndex);
                    if (z2 > z1) {
                        if (!(r1.right < r2.left+8 || r1.left > r2.right-8 || r1.bottom < r2.top+8 || r1.top > r2.bottom-8)) t1.classList.add('locked');
                    }
                });
            });
        }

        function selectTile(tile) {
            if (tile.classList.contains('locked') || collected.length >= 7) return;
            
            if(isPaused) resumeTimer();

            playSound('click');
            const imgSrc = tile.dataset.src;
            history.push({ src: imgSrc, zIndex: tile.style.zIndex, left: tile.style.left, top: tile.style.top });
            tile.style.transform = "scale(0) rotate(90deg)"; tile.style.opacity = "0";
            setTimeout(() => {
                tile.remove();
                activeTiles = activeTiles.filter(t => t !== tile);
                const firstIdx = collected.indexOf(imgSrc);
                if (firstIdx !== -1) collected.splice(firstIdx, 0, imgSrc); else collected.push(imgSrc);
                renderSlots(); updateLocks(); checkMatch(imgSrc);
            }, 150);
        }

        function renderSlots() {
            slotBar.innerHTML = '';
            collected.forEach(src => {
                const d = document.createElement('div'); d.className = 'tile-in-slot';
                d.innerHTML = `<img src="${src}">`; slotBar.appendChild(d);
            });
        }

        function checkMatch(src) {
            const trio = collected.filter(s => s === src);
            if (trio.length === 3) {
                setTimeout(() => {
                    playSound('match'); createParticles();
                    const now = Date.now();
                    if (now - lastMatchTime < 3000) {
                        comboMultiplier++;
                        const badge = document.getElementById('combo-badge');
                        badge.innerText = `COMBO x${comboMultiplier}`;
                        badge.style.display = 'block';
                    } else {
                        comboMultiplier = 1; document.getElementById('combo-badge').style.display = 'none';
                    }
                    lastMatchTime = now;
                    collected = collected.filter(s => s !== src);
                    history = history.filter(h => h.src !== src);
                    score += (150 * comboMultiplier); currentTriosFound++;
                    document.getElementById('score').innerText = score;
                    updateProgressBar(); renderSlots();
                    if (activeTiles.length === 0) { clearInterval(timerInterval); showWin(); }
                }, 250);
            } else if (collected.length >= 7) {
                clearInterval(timerInterval);
                gameOver("😵 Suporte Cheio!");
            }
        }

        function updateProgressBar() {
            document.getElementById('level-progress-bar').style.width = (currentTriosFound / totalTriosInLevel) * 100 + '%';
        }

        function createParticles() {
            const colors = ['#f1c40f', '#2ecc71', '#e74c3c', '#3498db', '#9b59b6'];
            for(let i=0; i<20; i++) {
                const p = document.createElement('div'); p.className = 'confetti';
                p.style.backgroundColor = colors[Math.floor(Math.random()*colors.length)];
                p.style.left = '50%'; p.style.top = '20%'; document.body.appendChild(p);
                const angle = Math.random() * Math.PI * 2; const velocity = 8 + Math.random() * 12;
                let x = 0, y = 0; let rot = 0;
                let anim = setInterval(() => {
                    x += Math.cos(angle) * velocity; y += Math.sin(angle) * velocity + 3; rot += 10;
                    p.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg)`;
                    if(y > window.innerHeight) { clearInterval(anim); p.remove(); }
                }, 16);
            }
        }

        function showWin() {
            playSound('win');
            document.getElementById('final-score').innerText = score;
            document.getElementById('win-overlay').style.display = 'flex';
            const stars = (timeLeft > 30) ? 3 : (timeLeft > 15 ? 2 : 1);
            document.querySelectorAll('#stars span').forEach((s, i) => s.className = i < stars ? 'active' : '');
            localStorage.setItem('tileLevel', level + 1); localStorage.setItem('tileScore', score);
        }

        function handleUndo() {
            if (chances.undo <= 0 || history.length === 0) return;
            chances.undo--; updateUIChances();
            const last = history.pop();
            const idx = collected.lastIndexOf(last.src);
            if (idx > -1) {
                collected.splice(idx, 1); renderSlots();
                const tile = document.createElement('div'); tile.className = 'tile';
                tile.innerHTML = `<img src="${last.src}">`; tile.dataset.src = last.src;
                tile.style.zIndex = last.zIndex; tile.style.left = last.left; tile.style.top = last.top;
                tile.onclick = () => selectTile(tile); container.appendChild(tile); activeTiles.push(tile); updateLocks();
            }
        }

        function handleHint() {
            if (chances.hint <= 0) return;
            const free = activeTiles.filter(t => !t.classList.contains('locked'));
            if(free.length > 0) {
                chances.hint--; updateUIChances();
                let target = free[0];
                if(collected.length > 0) {
                    const matchInSlot = free.find(t => t.dataset.src === collected[0]);
                    if(matchInSlot) target = matchInSlot;
                }
                selectTile(target);
            }
        }

        function handleShuffle() {
            if (chances.shuffle <= 0) return;
            chances.shuffle--; updateUIChances();
            activeTiles.forEach(t => { t.style.left = (Math.random()*80+5)+'%'; t.style.top = (Math.random()*75+5)+'%'; t.style.zIndex = Math.floor(Math.random()*10); });
            updateLocks();
        }

        function updateUIChances() {
            document.getElementById('undo-count').innerText = chances.undo;
            document.getElementById('hint-count').innerText = chances.hint;
            document.getElementById('shuffle-count').innerText = chances.shuffle;
            document.getElementById('pause-count').innerText = chances.pause;
        }

        function nextLevel() { level++; initGame(); }
        function resetGameAfterLoss() { openMiro(); level = 1; score = 0; localStorage.clear(); initGame(); }
        function playSound(name) { try { sounds[name].currentTime = 0; sounds[name].play(); } catch(e) {} }

        window.onresize = () => { updateLocks(); };
        preLoadAssets();
    </script>
</body>
</html>
