<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tile Match Pro - Evolution</title>
    <style>
        :root {
            --tile-w: min(13vw, 65px);
            --tile-h: min(17vw, 82px);
            --depth: 6px;
            --ui-bg: rgba(255, 255, 255, 0.2);
            --header-h: 22vh;
            --footer-h: 15vh;
            --accent: #f1c40f;
        }

        /* --- TELA DE CARREGAMENTO --- */
        #loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #2c3e50 url('imagens/imgbk.webp') no-repeat center center;
            background-size: cover;
            z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; text-align: center; font-family: 'Segoe UI', sans-serif;
        }

        .loader-bar { width: 60%; height: 10px; background: rgba(255,255,255,0.2); border-radius: 10px; overflow: hidden; max-width: 300px; }
        .loader-progress { width: 0%; height: 100%; background: #1e90ff; transition: width 0.3s; }

        /* --- ESTILO GERAL --- */
        body {
            margin: 0; padding: 0;
            display: flex; flex-direction: column;
            height: 100vh; width: 100vw;
            background: #2c3e50 url('imagens/imgbk.webp') no-repeat center center;
            background-size: cover;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden; touch-action: none;
        }

        #main-game { display: none; flex-direction: column; height: 100%; width: 100%; }

        .header-ui {
            height: var(--header-h);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000; position: relative;
            background: linear-gradient(to bottom, rgba(0,0,0,0.4), transparent);
        }

        .slot-bar {
            width: 92%; max-width: 450px; height: 75px;
            background: var(--ui-bg); border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 18px; backdrop-filter: blur(12px);
            display: flex; align-items: center; justify-content: flex-start;
            gap: 5px; padding: 0 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        /* --- ÁREA DE JOGO CORRIGIDA (LIMITADOR DEFINITIVO) --- */
        #game-board {
            flex: 1; /* Ocupa apenas o espaço entre header e footer */
            position: relative;
            width: 100%;
            overflow: hidden;
        }

        #tile-container {
            position: absolute;
            top: 5%; left: 5%; width: 90%; height: 90%; /* Área útil real das cartas */
        }

        /* --- TILES --- */
        .tile {
            position: absolute;
            width: var(--tile-w);
            height: var(--tile-h);
            background: linear-gradient(145deg, #ffffff, #f0f0f0);
            border-radius: 10px; cursor: pointer;
            box-shadow: 0 var(--depth) 0 #bdc3c7, 0 8px 15px rgba(0,0,0,0.3);
            display: flex; justify-content: center; align-items: center;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
        }

        .tile img { width: 80%; height: 80%; object-fit: contain; pointer-events: none; }
        .tile.locked { filter: brightness(0.4) grayscale(1); box-shadow: 0 4px 0 #7f8c8d; }

        .tile-in-slot {
            width: calc(var(--tile-w) * 0.85); height: calc(var(--tile-h) * 0.85);
            background: white; border-radius: 8px;
            display: flex; justify-content: center; align-items: center;
            animation: slideIn 0.3s ease-out;
        }
        .tile-in-slot img { width: 85% !important; height: 85% !important; }

        @keyframes slideIn { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* --- FOOTER --- */
        .footer-ui {
            height: var(--footer-h);
            display: flex; justify-content: center; align-items: center; gap: 20px;
            z-index: 1000; position: relative;
            background: linear-gradient(to top, rgba(0,0,0,0.4), transparent);
        }

        .btn-container { position: relative; }
        .chance-count {
            position: absolute; top: -5px; right: -5px;
            background: #ff4757; color: white; border-radius: 50%;
            width: 20px; height: 20px; font-size: 11px; font-weight: bold;
            display: flex; justify-content: center; align-items: center;
            border: 2px solid white; z-index: 1010;
        }

        .btn-action {
            width: 55px; height: 55px; background: white; border-radius: 15px; border: none;
            font-size: 24px; box-shadow: 0 5px 0 #dfe6e9; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
        }

        .btn-action.disabled { filter: grayscale(1); opacity: 0.5; pointer-events: none; }

        /* --- MODAIS --- */
        .overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); z-index: 2000;
            justify-content: center; align-items: center; backdrop-filter: blur(8px);
        }
        .modal { background: white; padding: 30px; border-radius: 25px; text-align: center; width: 80%; max-width: 320px; }
        .star-rating { font-size: 2.5rem; color: #ddd; margin: 15px 0; }
        .star-rating .active { color: var(--accent); }

        .confetti { position: absolute; width: 8px; height: 8px; z-index: 1500; pointer-events: none; }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div style="font-size:1.8rem; font-weight:900; margin-bottom:20px;">PREPARANDO CAMISA...</div>
        <div class="loader-bar"><div id="progress" class="loader-progress"></div></div>
    </div>

    <div id="main-game">
        <audio id="snd-click" src="https://cdn.pixabay.com/audio/2022/03/15/audio_731478147d.mp3"></audio>
        <audio id="snd-match" src="https://cdn.pixabay.com/audio/2021/08/04/audio_062539665a.mp3"></audio>
        <audio id="snd-lose" src="https://cdn.pixabay.com/audio/2024/02/09/audio_d0bc84d8f5.mp3"></audio>
        <audio id="snd-win" src="https://cdn.pixabay.com/audio/2021/08/04/audio_bb333792b0.mp3"></audio>

        <div class="header-ui">
            <div style="color:white; font-weight:bold; text-shadow:0 2px 4px rgba(0,0,0,0.5);">
                NÍVEL <span id="lvl">1</span> | PONTOS: <span id="score">0</span>
            </div>
            <div class="slot-bar" id="slot-bar"></div>
        </div>

        <div id="game-board">
            <div id="tile-container"></div>
        </div>

        <div class="footer-ui">
            <div class="btn-container">
                <span class="chance-count" id="undo-count">3</span>
                <button class="btn-action" id="btn-undo" onclick="handleUndo()">↩️</button>
            </div>
            <div class="btn-container">
                <span class="chance-count" id="hint-count">3</span>
                <button class="btn-action" id="btn-hint" onclick="handleHint()">🪄</button>
            </div>
            <div class="btn-container">
                <span class="chance-count" id="shuffle-count">3</span>
                <button class="btn-action" id="btn-shuffle" onclick="handleShuffle()">🔀</button>
            </div>
        </div>

        <div id="lose-overlay" class="overlay">
            <div class="modal">
                <h2>😵 Perdeu!</h2>
                <p>O suporte encheu.</p>
                <button style="width:100%; padding:15px; background:#1e90ff; color:white; border:none; border-radius:30px; font-weight:bold;" onclick="resetGameAfterLoss()">Recomeçar Tudo</button>
            </div>
        </div>

        <div id="win-overlay" class="overlay">
            <div class="modal">
                <h2>🏆 Nível Concluído!</h2>
                <div id="stars" class="star-rating"><span>★</span><span>★</span><span>★</span></div>
                <p>Pontuação: <span id="final-score">0</span></p>
                <button style="width:100%; padding:15px; background:#2ecc71; color:white; border:none; border-radius:30px; font-weight:bold;" onclick="nextLevel()">Próximo Nível</button>
            </div>
        </div>
    </div>

    <script>
        let level = parseInt(localStorage.getItem('tileLevel')) || 1;
        let score = parseInt(localStorage.getItem('tileScore')) || 0;
        let activeTiles = [];
        let collected = [];
        let history = [];
        let chances = { undo: 3, hint: 3, shuffle: 3 };
        let startTime;

        const container = document.getElementById('tile-container');
        const slotBar = document.getElementById('slot-bar');
        const sounds = {
            click: document.getElementById('snd-click'),
            match: document.getElementById('snd-match'),
            lose: document.getElementById('snd-lose'),
            win: document.getElementById('snd-win')
        };

        function preLoadAssets() {
            let loaded = 0;
            const images = [`imagens/imgbk.webp`];
            for(let i=1; i<=30; i++) images.push(`imagens/img${i}.webp`);
            
            images.forEach(src => {
                const img = new Image();
                img.src = src;
                img.onload = () => {
                    loaded++;
                    document.getElementById('progress').style.width = (loaded/images.length)*100 + '%';
                    if(loaded === images.length) {
                        setTimeout(() => {
                            document.getElementById('loading-screen').style.display='none';
                            document.getElementById('main-game').style.display='flex';
                            initGame();
                        }, 2000);
                    }
                };
                img.onerror = img.onload;
            });
        }

        function initGame() {
            container.innerHTML = '';
            slotBar.innerHTML = '';
            activeTiles = [];
            collected = [];
            history = [];
            startTime = Date.now();
            document.getElementById('lvl').innerText = level;
            document.getElementById('score').innerText = score;
            document.querySelectorAll('.overlay').forEach(o => o.style.display = 'none');
            updateUIChances();

            let numTrios = Math.min(3 + Math.floor(level / 1.5), 15);
            let totalTiles = numTrios * 3;

            let pool = [];
            for(let i=1; i<=30; i++) pool.push(`imagens/img${i}.webp`);
            pool.sort(() => Math.random() - 0.5);
            let levelImgs = pool.slice(0, numTrios);

            let deck = [];
            levelImgs.forEach(img => deck.push(img, img, img));
            deck.sort(() => Math.random() - 0.5);

            for(let i=0; i<totalTiles; i++) {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.innerHTML = `<img src="${deck[i]}">`;
                tile.dataset.src = deck[i];

                // Posição em % para NUNCA sair do contêiner
                tile.style.zIndex = Math.floor(i / 10);
                tile.style.left = (Math.random() * 82) + '%';
                tile.style.top = (Math.random() * 80) + '%';
                
                tile.onclick = () => selectTile(tile);
                container.appendChild(tile);
                activeTiles.push(tile);
            }
            updateLocks();
        }

        function updateLocks() {
            activeTiles.forEach(t => t.classList.remove('locked'));
            activeTiles.forEach(t1 => {
                const r1 = t1.getBoundingClientRect();
                const z1 = parseInt(t1.style.zIndex);
                activeTiles.forEach(t2 => {
                    const r2 = t2.getBoundingClientRect();
                    const z2 = parseInt(t2.style.zIndex);
                    if (z2 > z1) {
                        if (!(r1.right < r2.left + 5 || r1.left > r2.right - 5 || 
                              r1.bottom < r2.top + 5 || r1.top > r2.bottom - 5)) {
                            t1.classList.add('locked');
                        }
                    }
                });
            });
        }

        function selectTile(tile) {
            if (tile.classList.contains('locked') || collected.length >= 7) return;
            playSound('click');
            
            const imgSrc = tile.dataset.src;
            // Salva para o Undo
            history.push({ src: imgSrc, zIndex: tile.style.zIndex, left: tile.style.left, top: tile.style.top });

            tile.style.transform = "scale(0)";
            setTimeout(() => {
                tile.remove();
                activeTiles = activeTiles.filter(t => t !== tile);
                const lastIdx = collected.lastIndexOf(imgSrc);
                if (lastIdx !== -1) collected.splice(lastIdx + 1, 0, imgSrc);
                else collected.push(imgSrc);
                renderSlots();
                updateLocks();
                checkMatch(imgSrc);
            }, 150);
        }

        function renderSlots() {
            slotBar.innerHTML = '';
            collected.forEach(src => {
                const d = document.createElement('div');
                d.className = 'tile-in-slot';
                d.innerHTML = `<img src="${src}">`;
                slotBar.appendChild(d);
            });
        }

        function checkMatch(src) {
            const trio = collected.filter(s => s === src);
            if (trio.length === 3) {
                setTimeout(() => {
                    playSound('match');
                    createParticles();
                    collected = collected.filter(s => s !== src);
                    history = history.filter(h => h.src !== src);
                    score += 100;
                    document.getElementById('score').innerText = score;
                    renderSlots();
                    if (activeTiles.length === 0) showWin();
                }, 200);
            } else if (collected.length >= 7) {
                playSound('lose');
                document.getElementById('lose-overlay').style.display='flex';
            }
        }

        function createParticles() {
            for(let i=0; i<15; i++) {
                const p = document.createElement('div');
                p.className = 'confetti';
                p.style.backgroundColor = ['#f1c40f','#e74c3c','#2ecc71','#3498db'][Math.floor(Math.random()*4)];
                p.style.left = '50%'; p.style.top = '20%';
                document.body.appendChild(p);
                const angle = Math.random() * Math.PI * 2;
                const velocity = 5 + Math.random() * 10;
                let x = 0, y = 0;
                let anim = setInterval(() => {
                    x += Math.cos(angle) * velocity;
                    y += Math.sin(angle) * velocity + 2;
                    p.style.transform = `translate(${x}px, ${y}px) rotate(${x}deg)`;
                    if(y > window.innerHeight) { clearInterval(anim); p.remove(); }
                }, 16);
            }
        }

        function showWin() {
            playSound('win');
            const timeTaken = (Date.now() - startTime) / 1000;
            let stars = (timeTaken < 60) ? 3 : (timeTaken < 120 ? 2 : 1);
            document.querySelectorAll('#stars span').forEach((s, i) => s.className = i < stars ? 'active' : '');
            document.getElementById('final-score').innerText = score;
            document.getElementById('win-overlay').style.display = 'flex';
            localStorage.setItem('tileLevel', level + 1);
            localStorage.setItem('tileScore', score);
        }

        function handleUndo() {
            if (chances.undo <= 0 || history.length === 0) return;
            chances.undo--; updateUIChances();
            const last = history.pop();
            const idx = collected.lastIndexOf(last.src);
            if (idx > -1) {
                collected.splice(idx, 1); renderSlots();
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.innerHTML = `<img src="${last.src}">`;
                tile.dataset.src = last.src;
                tile.style.zIndex = last.zIndex; tile.style.left = last.left; tile.style.top = last.top;
                tile.onclick = () => selectTile(tile);
                container.appendChild(tile); activeTiles.push(tile); updateLocks();
            }
        }

        function handleHint() {
            if (chances.hint <= 0) return;
            chances.hint--; updateUIChances();
            const free = activeTiles.filter(t => !t.classList.contains('locked'));
            if(free.length > 0) selectTile(free[0]);
        }

        function handleShuffle() {
            if (chances.shuffle <= 0) return;
            chances.shuffle--; updateUIChances();
            activeTiles.forEach(t => {
                t.style.left = (Math.random() * 82) + '%';
                t.style.top = (Math.random() * 80) + '%';
            });
            updateLocks();
        }

        function updateUIChances() {
            document.getElementById('undo-count').innerText = chances.undo;
            document.getElementById('hint-count').innerText = chances.hint;
            document.getElementById('shuffle-count').innerText = chances.shuffle;
        }

        function nextLevel() { level++; initGame(); }
        function resetGameAfterLoss() { 
            window.open('http://mirodobutanta.com', '_blank');
            level = 1; score = 0; localStorage.clear(); initGame(); 
        }
        function playSound(name) { try { sounds[name].currentTime = 0; sounds[name].play(); } catch(e) {} }

        window.onresize = initGame;
        preLoadAssets();
    </script>
</body>
</html>
